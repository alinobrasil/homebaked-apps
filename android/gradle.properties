android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m

# The name, in one place. Renaming the project means changing these three lines (and the
# constants at the top of skill/homebaked/scripts/homebaked.py). BRAND_SCHEME is also the QR link scheme (homebaked://link?...), the
# mDNS service type (_homebaked._tcp) and the mini-app origin suffix (<app>.homebaked.internal).
# Keep it lowercase letters only, 14 characters at most.
BRAND_NAME=Homebaked
BRAND_APP_ID=app.homebaked
BRAND_SCHEME=homebaked

# Release signing lives in ~/.gradle/gradle.properties, never here:
#   HOMEBAKED_STORE_FILE, HOMEBAKED_STORE_PASSWORD, HOMEBAKED_KEY_ALIAS, HOMEBAKED_KEY_PASSWORD
